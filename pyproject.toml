[project]
name = "fastatacular"
dynamic = ["version"]
description = "A pure-Python library for reading and writing FASTA sequence files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
license = {text = "MIT"}
keywords = ["fasta", "proteomics", "genomics", "bioinformatics", "sequence"]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/tacular-omics/fastatacular"
Issues = "https://github.com/tacular-omics/fastatacular/issues"
Changelog = "https://github.com/tacular-omics/fastatacular/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastatacular"]

[tool.hatch.version]
path = "src/fastatacular/__init__.py"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=9",
    "pytest-cov>=6.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/fastatacular"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
